name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (build, typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace packages (e.g. swig-guard) are consumed via their dist/
      # output, so dependents (agent-guard, wallet, showcase, extension)
      # need it built before typecheck can resolve their types.
      - run: pnpm -r --if-present build

      - run: pnpm -r --if-present typecheck

      - run: pnpm -r --if-present lint

      - run: pnpm -r --if-present test

  contracts:
    name: Contracts (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - run: cargo fmt --manifest-path contracts/Cargo.toml --all -- --check

      # payment-guard is the retired custodial vault (not part of the product)
      # and still calls deprecated event APIs, so clippy covers the live contract only.
      - run: cargo clippy --manifest-path contracts/Cargo.toml -p merchant-spend-policy --all-targets -- -D warnings

      - run: cargo test --manifest-path contracts/Cargo.toml

      # Tests run natively; this catches anything that only breaks for the on-chain target.
      - run: cargo build --manifest-path contracts/Cargo.toml --release --target wasm32v1-none -p merchant-spend-policy

  docs:
    name: Docs (baret_docs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baret_docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: baret_docs/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  docs-consistency:
    name: Docs consistency (links, paths, env, packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/check-docs.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/check-secrets.mjs
