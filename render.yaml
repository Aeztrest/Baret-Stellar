# Render Blueprint — ücretsiz backend (apps/server, Fastify API)
# Kullanım: render.com → New → Blueprint → bu repoyu seç. Render bu dosyayı okur.
# Free plan: 15 dk hareketsizlikte uykuya dalar, ilk istekte ~30 sn soğuk başlangıç olur.
services:
  - type: web
    name: baret-api
    runtime: node
    plan: free
    region: frankfurt
    # Render PORT env'ini otomatik verir; sunucu config'i PORT'u okuyor (apps/server/src/config/index.ts).
    # --prod=false şart: NODE_ENV=production olduğunda pnpm devDeps'i (typescript, @types/node) atlar
    # ve tsc derlemesi "Cannot find name 'node:fs'" ile çöker. Bu flag onları zorla kurar.
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @stellar-thorn/server build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: STELLAR_NETWORK
        value: testnet
      # Zorunlu — bunlar olmadan sunucu açılışta çöker (config zod şeması .url() ister)
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      # Reverse proxy arkasında gerçek istemci IP + rate limit
      - key: DELTAG_TRUST_PROXY
        value: "true"
      # Frontend (apps/showcase/src/baret/analyze.ts) sabit "dev-key-change-me" gönderiyor.
      # Demo'nun açık çalışması için aynısını ver; özel anahtarla kısıtlamak istersen Render
      # panelinden değiştir ve frontend'deki API_KEY'i de güncelle.
      - key: DELTAG_API_KEYS
        value: dev-key-change-me
      # X402_ENABLED sadece POST /v1/analyze'ın kendi x402 ödeme kapısını
      # açar/kapatır — DELTAG_API_KEYS zaten açık olduğu için kapalı bırakıyoruz.
      # Scrybe showcase'inin /demo/scrybe endpoint'i bundan bağımsız: sadece
      # X402_MERCHANT_SECRET'a bakar, o olmadan route hiç kayıt olmuyor (404).
      - key: X402_ENABLED
        value: "false"
      # Scrybe (Cortex) showcase'inin gerçek x402 ödeme akışı için zorunlu.
      # sync: false → Render panelinden elle girilir, buraya gerçek değer
      # yazılmaz. Değer: `pnpm --filter @stellar-thorn/server x402-setup`
      # çıktısındaki (veya apps/server/.env'deki) X402_MERCHANT_SECRET.
      - key: X402_MERCHANT_SECRET
        sync: false
